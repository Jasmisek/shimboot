name: build-image
run-name: Build the shimboot Alpine disk image for octopus
on: [push]

jobs:
  build:
    permissions:
      contents: write

    strategy: 
      matrix:
        board: [octopus]
        distro: [alpine]

    #ubuntu-latest moved to 26.04 in october 2026, where the build fails
    runs-on: ubuntu-24.04
    steps:
      - name: remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: download repo
        uses: actions/checkout@v4
      
      - name: run build
        run: |
          set -o pipefail
          {
            sudo apt-get update
            sudo apt-get upgrade -y
            sudo DEBUG=1 ./build_complete.sh ${{ matrix.board }} distro=${{ matrix.distro }} compress_img=1 quiet=1
          } 2>&1 | tee build.log

      #show the end of the log as an annotation so the error is visible
      #on the run summary page without opening the full log
      - name: report build error
        if: failure()
        run: |
          tail -n 40 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}' > build_tail.txt
          echo "::error title=build failed::$(cat build_tail.txt)"

      - name: upload img
        uses: actions/upload-artifact@v4
        with:
          name: shimboot_${{ matrix.board }}_${{ matrix.distro }}
          path: data/shimboot_${{ matrix.board }}.bin
          compression-level: 7
  
      - name: create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: data/shimboot_${{ matrix.board }}.zip